spring.application.name=blog

# MySQL DB connection with defaults
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=DISABLED&connectTimeout=10000&socketTimeout=10000&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&maxReconnects=5
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# JPA / Hibernate - disable any database connections on startup
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Prevent first-run initialization
spring.jpa.defer-datasource-initialization=false
spring.datasource.initialization-mode=never
spring.jpa.properties.jakarta.persistence.jdbc.time_zone=UTC

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.com.zaxxer.hikari=WARN

# Server configuration
server.port=8080
server.servlet.context-path=/api

# JWT configuration (used for issuing and validating tokens)
# Secret must be >= 256 bits (base64-encoded 32 bytes); this is a secure default
jwt.secret={JWT_SECRET}
jwt.expiration-ms=86400000

